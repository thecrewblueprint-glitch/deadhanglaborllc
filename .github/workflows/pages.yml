name: Deploy redesign branch to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-redesign"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/purple-amber-industrial-2026-09-07

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redesign artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: deadhang-redesign-pages
          path: '.'

      - name: Let branch-source Pages deployment finish first
        run: sleep 45

      - name: Deploy redesign to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: deadhang-redesign-pages
